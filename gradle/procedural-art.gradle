        spec.glyphs[glyph].eachWithIndex { row,y -> row.eachWithIndex { pixel,x -> if(pixel=='#')c.put(x,y,color(spec.phosphor)) } }
        c
    }
    static List controllerHousing() {
        def body=[cuboid([0,0,3],[16,16,16],'metal'),cuboid([0,0,0],[2,16,3],'metal'),
            cuboid([14,0,0],[16,16,3],'metal'),cuboid([2,0,0],[14,2,3],'metal'),
            cuboid([2,14,0],[14,16,3],'metal'),cuboid([2,2,1],[14,14,3],'recess'),
            cuboid([3,6,0.5],[13,13,1],'bezel'),cuboid([3,2.5,0.5],[13,5.5,1],'controls')]
        def screen=cuboid([3.5,6.5,0.49],[12.5,12.5,0.49],'screen')
        screen.faces=[north:screen.faces.north];body << screen
        body
    }
    static List harnessAnchor() {
        def body=[cuboid([0,15,0],[16,16,16],'metal'),cuboid([2,12,2],[14,15,14],'metal'),cuboid([5,11,5],[11,12,11],'recess'),
            cuboid([4,11,4],[12,12,5],'metal'),cuboid([4,11,11],[12,12,12],'metal'),
            cuboid([4,11,5],[5,12,11],'metal'),cuboid([11,11,5],[12,12,11],'metal')]
        // Actual strap origins are the four corners at y=13, including multi-Harness footprints.
        [0,15].each { x -> [0,15].each { z ->
            body << cuboid([x,13,z],[x+1,15,z+1],'fastener')
            body << cuboid([x==0?1:12,14,z==0?0:15],[x==0?4:15,15,z==0?1:16],'metal')
            body << cuboid([x==0?0:15,14,z==0?1:12],[x==0?1:16,15,z==0?4:15],'metal')
        } }
        body
    }
    static List sumpBasin() {
        def body=[cuboid([0,0,0],[16,0.5,16],'recess'),cuboid([0,0.5,0],[16,3,2],'metal'),
            cuboid([0,0.5,14],[16,3,16],'metal'),cuboid([0,0.5,2],[2,3,14],'metal'),cuboid([14,0.5,2],[16,3,14],'metal')]
        [[2,2,6,14],[10,2,14,14],[6,2,10,6],[6,10,10,14]].each { p ->
            def plate=cuboid([p[0],0.5,p[1]],[p[2],2.5,p[3]],'channels')
            plate.faces.up.uv=[p[0],p[1],p[2],p[3]];body << plate
        }
        [6,7.5,9].each { x -> body << cuboid([x,2.25,6],[x+0.5,2.75,10],'fastener') }
        [6,9.5].each { z -> body << cuboid([6,2.25,z],[10,2.75,z+0.5],'fastener') }
        body
    }
    static List feederReel(Map spec) {
        double lo=8-spec.bodyWidth/2.0,hi=8+spec.bodyWidth/2.0,r=spec.spindleDiameter/2.0
        def body=[]
        // Closed end plates with opaque dark socket recesses. Winding is solid:
        // texture ribs communicate packed hose without holes between individual laps.
        [lo,hi-spec.endPlateDepth].each { x ->
            def plate=cuboid([x,lo,lo],[x+spec.endPlateDepth,hi,hi],'metal')
            plate.faces[x==lo?'west':'east'].texture='#socket';body<<plate
        }
        body<<cuboid([lo+spec.endPlateDepth,lo,lo],[hi-spec.endPlateDepth,hi,hi],'hose')
        // The spindle itself reaches the neighboring conduit's native central arm.
        // Formed rendering substitutes the physical service-anchor connection.
        body<<cuboid([hi,8-r,8-r],[16,8+r,8+r],'connection')
        body
    }
    static List grinderHousing() {
        def body=[cuboid([2,2,3],[14,14,5],'metal'),cuboid([4,4,5],[12,12,5.25],'recess')]
        [[2,2,14,4],[2,12,14,14],[2,4,4,12],[12,4,14,12]].each { p ->
            body << cuboid([p[0],p[1],5],[p[2],p[3],9],'metal')
        }
        body.addAll(toothedDrum());body
    }
    static List toothedDrum() {
        def body=[cuboid([4.5,6,5.5],[11.5,10,8],'bezel'),cuboid([3.5,7.25,6],[12.5,8.75,7.5],'fastener')]
        [5,7,9,11].each { x ->
            body << cuboid([x-.4,5.25,6.5],[x+.4,6.5,8.5],'fastener')
            body << cuboid([x-.4,9.5,6.5],[x+.4,10.75,8.5],'fastener')
        };body
    }
    static List toolViseHousing(Map v) {
