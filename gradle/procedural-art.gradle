/** Semantic pixels: material channels, fixed RGBA, exposed metal, or transparent.
 * No RGB heuristic can turn a functional marking into tier material. */
class MobPixelCanvas {
    final int size = 16
    final List pixels = new ArrayList(Collections.nCopies(256, null))
    void put(int x, int y, Object token) {
        if (x < 0 || y < 0 || x >= size || y >= size) throw new IllegalArgumentException('Pixel outside 16x16 canvas')
        pixels[y * size + x] = token
    }
    Object get(int x, int y) { pixels[y * size + x] }
    void panel(int x0, int y0, int x1, int y1, Object token) {
        if (x0 > x1 || y0 > y1) throw new IllegalArgumentException('Reversed panel bounds')
        for (int y = y0; y <= y1; y++) for (int x = x0; x <= x1; x++) put(x, y, token)
    }
    void line(int x0, int y0, int x1, int y1, Object token) {
        int dx = Math.abs(x1-x0), sx = x0 < x1 ? 1 : -1
        int dy = -Math.abs(y1-y0), sy = y0 < y1 ? 1 : -1, error = dx+dy
        while (true) {
            put(x0, y0, token)
            if (x0 == x1 && y0 == y1) break
            int twice = 2*error
            if (twice >= dy) { error += dy; x0 += sx }
            if (twice <= dx) { error += dx; y0 += sy }
        }
    }
    void bevel(int x0, int y0, int x1, int y1, boolean raised = true) {
        line(x0,y0,x1,y0, raised ? 'light' : 'deep')
        line(x0,y0,x0,y1, raised ? 'light' : 'deep')
        line(x0,y1,x1,y1, raised ? 'deep' : 'light')
        line(x1,y0,x1,y1, raised ? 'deep' : 'light')
    }
    void rivet(int x, int y) { put(x,y,'deep'); put(x,y-1,'highlight') }
    void slot(int x0, int y0, int x1, int y1) {
        panel(x0,y0,x1,y1,'deep'); line(x0,y1+1,x1,y1+1,'light')
    }
    void indicator(int x, int y, int rgba) { put(x,y,rgba) }
    void recessedBorder(int x0, int y0, int x1, int y1) {
        def recess=[material:'base',toward:'shadow',eighths:3]
        line(x0,y0,x1,y0,recess); line(x0,y1,x1,y1,recess)
        line(x0,y0,x0,y1,recess); line(x1,y0,x1,y1,recess)
    }
    void fastener(int x, int y) { put(x,y,'shadow') }
    void materialVariation() {
        // Quiet, authored clusters: one eighth of a brightness-channel step.
        def soft=[material:'base',toward:'light',eighths:1]
        [[5,5],[6,5],[7,5],[5,6],[9,9],[10,9],[10,10]].each { p -> put(p[0],p[1],soft) }
    }
    // One four-pixel diagonal motif reflected into all corners. Only endpoint
    // cardinal arms change with direction; the 6..9 center remains unobstructed.
    void channels(String direction, Object token) {
        if (!(direction in ['none','inward','outward'])) throw new IllegalArgumentException('Unknown direction')
        def motif=(1..4).collect { p -> [p,p] }
        // Each cardinal stroke is two pixels including the shared endpoint.
        if (direction == 'inward') motif.addAll([[3,4],[4,3]])
        if (direction == 'outward') motif.addAll([[1,2],[2,1]])
        [false,true].each { flipX -> [false,true].each { flipY ->
            motif.each { p -> put(flipX ? 15-p[0] : p[0],flipY ? 15-p[1] : p[1],token) }
        } }
    }
    void weather(long seed) {
        // Two short, irregular scratches and one worn-edge cluster. Never noise.
        def random = new Random(seed)
        def candidates = [[4,6],[8,4],[5,10],[8,9],[3,8],[9,7]]
        Collections.shuffle(candidates, random)
        candidates.take(2).each { p ->
            put(p[0],p[1],'shadow'); put(p[0]+1,p[1],'wear')
            put(p[0]+2,p[1]-1,[material:'base',toward:'light',eighths:2])
        }
        int offset=5+random.nextInt(5), edge=random.nextInt(4)
        def edgePixels=[[offset,1],[offset+1,1],[offset+2,0]]
        edgePixels.eachWithIndex { p,i ->
            int x=p[0],y=p[1]
            for(int turn=0;turn<edge;turn++) { int nextX=15-y; y=x; x=nextX }
            put(x,y,i == 1 ? 'wear' : [material:'base',toward:'light',eighths:1])
        }
    }
    BufferedImage image(List channels, List palette, int wear) {
        def out = new BufferedImage(16,16,BufferedImage.TYPE_INT_ARGB)
        pixels.eachWithIndex { token, i ->
            if (token instanceof String && token != 'wear' && !channels.contains(token))
                throw new IllegalArgumentException("Unknown material token ${token}")
            int rgba = token instanceof Map ? MobProceduralArt.materialMix(token,channels,palette) :
                    token == null ? 0 : token instanceof Number ? token.intValue() :
                    token == 'wear' ? wear : MobProceduralArt.color(palette[channels.indexOf(token)])
            out.setRGB(i%16, (int)(i/16), rgba)
        }
        out
    }
}

/** Independent integer-pixel biological shapes. This renderer accepts no image inputs. */
class MobBiologicalArt {
    static MobPixelCanvas draw(Map spec, Map asset) {
        def c=new MobPixelCanvas()
        def stamp={ String shape,String palette,int ox,int oy ->
            spec.primitives[shape].eachWithIndex { row,y -> row.eachWithIndex { digit,x ->
                if(digit != '.')c.put(ox+x,oy+y,MobProceduralArt.color(spec.palettes[palette][Integer.parseInt(digit)]))
            } }
        }
        if(asset.tissue) {
            c.panel(0,0,15,15,MobProceduralArt.color(spec.palettes.tissue[1]))
            def random=new Random(asset.seed as long)
            // Authored lobes, toroidally tiled with seeded palette/placement variation.
            for(int gy=-1;gy<4;gy++)for(int gx=-1;gx<4;gx++) {
                int ox=gx*5+random.nextInt(2),oy=gy*5+random.nextInt(2)
                spec.primitives.tissue_cluster.eachWithIndex { row,y -> row.eachWithIndex { digit,x ->
                    if(digit!='.') {
                        int px=Math.floorMod(ox+x,16),py=Math.floorMod(oy+y,16)
                        c.put(px,py,MobProceduralArt.color(spec.palettes.tissue[Integer.parseInt(digit)]))
                    }
                } }
            }
            [[3,4],[11,10],[6,14]].each { p -> c.put(p[0],p[1],MobProceduralArt.color(spec.palettes.tissue[5])) }
        }
        asset.layers.each { l -> stamp(l.shape,l.palette,l.at[0] as int,l.at[1] as int) }
        asset.lines?.each { l -> c.line(l.from[0] as int,l.from[1] as int,l.to[0] as int,l.to[1] as int,MobProceduralArt.color(spec.palettes[l.palette][l.index])) }
        if(asset.id=='item_essence') {
            c.line(5,8,5,10,MobProceduralArt.color(spec.palettes.glass[3]))
            c.put(10,7,MobProceduralArt.color(spec.palettes.glass[3]))
        }
        c
    }
    static void generate(File root,File output,List assets,Set names) {
        def file=new File(root,'biological.json')
        if(!file.isFile())return // Small collision fixtures have no biological recipes.
        def spec=new JsonSlurper().parse(file)
        assert spec.authorship=='AUTHORED_PROCEDURAL'
        assert spec.primitives.values().every { rows -> rows.every { it ==~ /[.0-9]+/ } }
        spec.assets.each { a ->
            assert a.path ==~ /(?:blocks|items)\/[a-z][a-z0-9_]*/
            assert a.seed instanceof Integer && a.seed>=0
            String path='assets/mobvats/textures/'+a.path+'.png'
            if(!names.add(path))throw new IllegalArgumentException('Biological output collision: '+path)
            def image=draw(spec,a).image([],[],0)
            MobProceduralArt.png(new File(output,path),image)
            assert MobProceduralArt.hash(new File(output,path)) != a.historicalSha256
            assets << [path:path,recipe:'tools/procedural-art/biological.json',recipeId:a.id,
                paletteSource:'tools/procedural-art/biological.json',finish:'fixed_biological',seed:a.seed,
                provenance:spec.authorship,inputs:spec.inputs,overlays:[],handAuthoredOverlay:false,
                historicalSha256:a.historicalSha256,replaces:a.replaces,sha256:MobProceduralArt.hash(new File(output,path))]
        }
    }
    static void preview(File output,File preview) {
        def assets=new JsonSlurper().parse(new File(output,'META-INF/mobvats-procedural-art.json')).assets.findAll { it.finish=='fixed_biological' }
        def sheet=new BufferedImage(1000,assets.size()*210,BufferedImage.TYPE_INT_ARGB)
        def g=sheet.createGraphics();g.setColor(java.awt.Color.decode('#343A3D'));g.fillRect(0,0,sheet.width,sheet.height)
        g.setFont(new java.awt.Font('Monospaced',0,13))
        assets.eachWithIndex { a,i ->
            def im=ImageIO.read(new File(output,a.path));String name=a.recipeId
            MobProceduralArt.png(new File(preview,'biological/'+name+'.png'),im)
            MobProceduralArt.png(new File(preview,'biological/'+name+'-8x.png'),MobProceduralArt.enlarged(im,8))
            int y=i*210
            g.setColor(java.awt.Color.WHITE);g.drawString(name,12,y+20)
            g.drawImage(im,12,y+40,null);g.drawImage(MobProceduralArt.enlarged(im,2),48,y+40,null)
            g.drawImage(MobProceduralArt.enlarged(im,8),100,y+40,null)
            g.drawString('16px / inventory 32px / nearest x8',12,y+190)
            if(a.path.contains('/blocks/')) {
                // Existing cube/cube_all models: unchanged 0..16 UVs, north face + side/top.
                def side=ImageIO.read(new File(output,'assets/mobvats/textures/blocks/'+(name=='vat_face'?'vat_head':name)+'.png'));
                def front=name=='vat_head'?ImageIO.read(new File(output,'assets/mobvats/textures/blocks/vat_face.png')):im;
                [front,side,side].eachWithIndex { tex,face ->
                    for(int py=0;py<16;py++)for(int px=0;px<16;px++) {
                        def project={ u,v ->
                            if(face==0)return [430+u*4, y+72+u*2+v*4]
                            if(face==1)return [494+u*4,y+104-u*2+v*4]
                            [430+(u+v)*4,y+72+(u-v)*2]
                        }
                        def points=[[px,py],[px+1,py],[px+1,py+1],[px,py+1]].collect { p -> project(p[0],p[1]) }
                        g.setColor(new java.awt.Color(tex.getRGB(px,py),true))
                        g.fillPolygon(points.collect{it[0] as int} as int[],points.collect{it[1] as int} as int[],4)
                    }
                }
                g.setColor(java.awt.Color.WHITE);g.drawString('Cube model UV context',420,y+205)
            } else {
                g.drawImage(MobProceduralArt.enlarged(im,4),430,y+60,null)
                g.setColor(java.awt.Color.WHITE);g.drawString('item/generated layer0 context',420,y+150)
            }
        }
        g.dispose();MobProceduralArt.png(new File(preview,'biological.png'),sheet)
    }
}

class MobProceduralArt {
    static final String VERSION = '1.13.0'
    static final List FACES = ['down','up','north','south','west','east']
    static Map cuboid(List from, List to, String material) {
        [from:from,to:to,faces:FACES.collectEntries { [(it):[uv:[0,0,16,16],texture:'#'+material]] }]
    }
    static List frame(Map geometry, String family, boolean glass) {
        def elements=[]
        // Eight trihedral fittings: three thin arms per corner, never solid corner cubes.
        [0,1].each { x -> [0,1].each { y -> [0,1].each { z ->
            def corner=[x,y,z]
            (0..2).each { axis ->
                def from=corner.collect { it ? 15 : 0 }, to=corner.collect { it ? 16 : 1 }
                from[axis]=corner[axis] ? 16-geometry.cornerLength : 0
                to[axis]=corner[axis] ? 16 : geometry.cornerLength
                if(axis>0) {if(corner[axis])to[axis]=15;else from[axis]=1}
                elements << cuboid(from,to,'frame')
                // Mixer double-flanged panel corner; Vat keeps its single narrow edge reinforcement.
                if(family == 'mixer') {
                    int tangent=(axis+1)%3
                    def f=from.toList(), t=to.toList()
                    if(corner[axis])t[axis]=14;else f[axis]=2
                    f[tangent]=corner[tangent] ? 14 : 1; t[tangent]=corner[tangent] ? 15 : 2
                    elements << cuboid(f,t,'trim')
                }
            }
        } } }
        // Twelve one-pixel rails between fittings, plus inset glass-only accents.
        (0..2).each { axis -> [0,1].each { a -> [0,1].each { b ->
            def transverse=(0..2).findAll { it != axis }
            def from=[0,0,0],to=[1,1,1]
            from[axis]=geometry.cornerLength; to[axis]=16-geometry.cornerLength
            [a,b].eachWithIndex { sign,i -> from[transverse[i]]=sign ? 16-geometry.railWidth : 0; to[transverse[i]]=sign ? 16 : geometry.railWidth }
            elements << cuboid(from,to,'trim')
            if(glass) {
                def f=from.collect { it == 0 ? 1 : it == 15 ? 14 : it }, t=to.collect { it == 1 ? 2 : it == 16 ? 15 : it }
                elements << cuboid(f,t,'accent')
            }
        } } }
        elements
    }
    static Map previewModel(Map geometry, String family, String cladding, String resource, String finish) {
        double lo=8-geometry.nodeWidth/2.0, hi=8+geometry.nodeWidth/2.0
        def elements=[cuboid([lo,lo,lo],[hi,hi,hi],'node')]
        (0..2).each { axis -> [false,true].each { positive ->
            def from=[lo,lo,lo], to=[hi,hi,hi]
            from[axis]=positive ? hi : 0; to[axis]=positive ? 16 : lo
            elements << cuboid(from,to,'pipe')
        } }
        if(cladding != 'bare')elements.addAll(frame(geometry,family,cladding=='glass'))
        def base="mobvats:block/procedural/${finish}/"
        [render_type:cladding=='glass'?'minecraft:translucent':'minecraft:cutout',ambientocclusion:false,textures:[particle:base+"conduit_node_${resource}",
            node:base+"conduit_node_${resource}",pipe:base+"conduit_pipe_${resource}",frame:base+"${family}_frame",trim:base+"${family}_trim",accent:base+"${family}_accent"],elements:elements]
    }
    static void conduitAssets(File root, File output, Map palettes, List assets, Set names, Set productionPaths) {
        def geometry=new JsonSlurper().parse(new File(root,'geometry.json'))
        def repository=root.parentFile.parentFile
        def physical=new File(repository,'src/main/java/net/impactvector/mobvats/gamecontent/multiblock/conduit/ConduitGeometry.java').text
        def diameter=(physical =~ /DIAMETER=(\d+(?:\.\d+)?)\/16/)
        assert diameter.find() && geometry.nodeWidth == Double.parseDouble(diameter.group(1)) : 'Preview must use the physical pipe diameter'
        assert geometry.cornerLength == 4 && geometry.railWidth == 1 && geometry.tapEndpointRatio == 0.5
        json(new File(output,'assets/mobvats/conduit_preview.json'),geometry)
        productionPaths.add('assets/mobvats/conduit_preview.json')
        def model={ String id, Map value ->
            String path="assets/mobvats/models/block/${id}.json"
            assert productionPaths.add(path) : 'Model output collision: '+path
            json(new File(output,path),value)
        };
        ['master','t1','t2','t3'].each { finish ->
            def palette=finish=='master' ? palettes.grayscale : palettes.tiers[finish].metal
            int wear=color(finish=='master' ? palettes.grayscale[1] : palettes.tiers[finish].wear)
            def texture={ String id, MobPixelCanvas canvas ->
                String path="assets/mobvats/textures/block/procedural/${finish}/${id}.png"
                assert names.add(path)
                def file=new File(output,path); png(file,canvas.image(palettes.channels,palette,wear))
                assets << [path:path,recipe:'tools/procedural-art/geometry.json',recipeId:id,paletteSource:'tools/procedural-art/palettes.json',finish:finish,seed:null,resource:null,direction:null,handAuthoredOverlay:false,overlays:[],sha256:hash(file)]
            };
            ['item','fluid'].each { resource ->
                ['node','pipe'].each { part ->
                    def c=new MobPixelCanvas(); c.panel(0,0,15,15,'base');c.bevel(0,0,15,15)
                    c.panel(part=='node'?6:7,0,part=='node'?9:8,15,color(palettes.fixed[resource]))
                    texture("conduit_${part}_${resource}",c)
                }
            };
            ['vat','mixer'].each { family ->
                ['frame','trim','accent','surface','glass'].each { part ->
                    def c=new MobPixelCanvas()
                    int pane=(geometry.glassAlpha<<24) | (color(geometry.glassColor)&0xffffff)
                    int edge=(geometry.glassEdgeAlpha<<24) | (color(geometry.glassColor)&0xffffff)
                    if(part in ['surface','glass']) {
                        c.panel(0,0,15,15,pane)
                        if(part=='glass') {c.line(0,0,15,0,edge);c.line(0,15,15,15,edge);c.line(0,0,0,15,edge);c.line(15,0,15,15,edge)}
                    } else if(part=='accent')c.panel(0,0,15,15,edge)
                    else {c.panel(0,0,15,15,part=='trim'?'shadow':'base');c.bevel(0,0,15,15);}
                    if(part=='glass') {
                        c.line(0,0,15,0,'base'); c.line(0,15,15,15,'base');c.line(0,0,0,15,'base');c.line(15,0,15,15,'base');
                        [0,15].each { x -> [0,15].each { y ->
                            c.line(x,y,x==0?3:12,y,'light');c.line(x,y,x,y==0?3:12,'light')
                        } }
                    }
                    if(family=='mixer' && part in ['frame','trim','glass']) {
                        c.line(2,2,13,2,'deep');c.line(2,13,13,13,'deep');c.fastener(3,3);c.fastener(12,12)
                    } else if(part=='frame') {c.recessedBorder(1,1,14,14);c.fastener(3,3);c.fastener(12,12)}
                    texture("${family}_${part}",c)
                }
                def base="mobvats:block/procedural/${finish}/"
                model("procedural/${finish}/${family}_glass",[parent:'minecraft:block/cube_all',render_type:'minecraft:translucent',textures:[all:base+"${family}_glass",particle:base+"${family}_trim"]])
                if(finish=='t1') {
                    model("${family}_glass",[parent:"mobvats:block/procedural/${finish}/${family}_glass"])
                    model(family=='vat'?'formed_glass_material':'mixer_formed_glass_material',[parent:'minecraft:block/cube_all',render_type:'minecraft:translucent',textures:[all:base+"${family}_surface",particle:base+"${family}_trim"]])
                }
            };
            def bufferPane=new MobPixelCanvas();bufferPane.panel(0,0,15,15,(geometry.bufferGlassAlpha<<24)|(color(geometry.glassColor)&0xffffff))
            texture('buffer_glass',bufferPane)
            def bufferMetal=new MobPixelCanvas();bufferMetal.panel(0,0,15,15,'base');bufferMetal.recessedBorder(1,1,14,14);
            [3,12].each { x -> [3,12].each { y -> bufferMetal.fastener(x,y) } }
            bufferMetal.weather(29L);texture('buffer_metal',bufferMetal)
            conduitModels(geometry, finish, model,output,productionPaths)
            bufferModels(geometry,finish,model)
            fixtureAssets(root,output,geometry,finish,palettes,assets,names,productionPaths,texture,model)
            machineryAssets(root,output,finish,palettes,assets,productionPaths,texture,model)
            if(finish=='t1') {
                ['fluid_buffer'].each { id ->
                    String path="assets/mobvats/models/item/${id}.json"
                    assert productionPaths.add(path)
                    json(new File(output,path),inventoryModel("mobvats:block/procedural/t1/${id}"))
                }
            }
        }
    }
    // Faceted ribbon with a closed thickness. Triangles are encoded as degenerate
    // quads, so every face is planar and has an unambiguous outward normal.
    static List screwAuger(Map spec) {
        def quads=[]
        def point={ step,radius,offset ->
            double angle=step*2*Math.PI*spec.turns/spec.segments
            [8+radius*Math.cos(angle),8+radius*Math.sin(angle),spec.start+step*spec.length/spec.segments+offset]
        }
        def triangle={ a,b,c -> quads << [a,b,c,c] }
        for(int i=0;i<spec.segments;i++) {
            def a=point(i,spec.innerRadius,0),b=point(i,spec.outerRadius,0)
            def c=point(i+1,spec.outerRadius,0),d=point(i+1,spec.innerRadius,0)
            def A=point(i,spec.innerRadius,spec.thickness),B=point(i,spec.outerRadius,spec.thickness)
            def C=point(i+1,spec.outerRadius,spec.thickness),D=point(i+1,spec.innerRadius,spec.thickness)
            triangle(a,b,c);triangle(a,c,d);triangle(D,C,B);triangle(D,B,A)
            triangle(b,B,C);triangle(b,C,c);triangle(d,D,A);triangle(d,A,a)
            if(i==0) {triangle(a,A,B);triangle(a,B,b)}
            if(i==spec.segments-1) {triangle(c,C,D);triangle(c,D,d)}
        }
        // Offset thickness is toward +Z: the lower ribbon faces -Z, and
        // the outer rim faces radially outward. Reverse the construction winding.
        quads.collect { q -> [q[0],q[2],q[1],q[1]] }
    }
    static List squareFlange(double z,String material) {
        def parts=[cuboid([3,3,z],[13,6,z+1],material),cuboid([3,10,z],[13,13,z+1],material),
            cuboid([3,6,z],[6,10,z+1],material),cuboid([10,6,z],[13,10,z+1],material)]
        parts.each { e ->
            ['north','south'].each { face -> e.faces[face].uv=[(e.from[0]-3)*1.6,(13-e.to[1])*1.6,(e.to[0]-3)*1.6,(13-e.from[1])*1.6] }
            ['down','up','west','east'].each { face -> e.faces[face].texture='#metal' }
        }
        parts
    }
    static List fixtureBody(String kind) {
        if(kind=='valve') return [cuboid([5,5,5],[11,11,11],'metal'),
            cuboid([3,3,3],[13,5,13],'identity'),cuboid([3,11,3],[13,13,13],'identity')]
        if(kind=='pump') return squareFlange(3,'identity')+squareFlange(12,'identity')+pumpHousing()+[
            cuboid([7.4,7.4,4],[8.6,8.6,12],'metal'),
            // Seed is replaced exactly once at bake time with the authored helix.
            cuboid([7,7,7],[9,9,9],'auger')]
        assert kind=='void'
        def body=[cuboid([4.5,4.5,4.5],[11.5,11.5,11.5],'hot')]
        // Eight accent fittings and twelve rails partition the cubic frame.
        [3,12].each { x -> [3,12].each { y -> [3,12].each { z ->
            body << cuboid([x,y,z],[x+1,y+1,z+1],'identity')
        } } }
        (0..2).each { axis ->
            def tangents=(0..2).findAll { it!=axis }
            [3,12].each { u -> [3,12].each { v ->
                def from=[4,4,4],to=[12,12,12]
                from[tangents[0]]=u;to[tangents[0]]=u+1
                from[tangents[1]]=v;to[tangents[1]]=v+1
                body << cuboid(from,to,'metal')
            } }
            [3,12].each { plane -> body.addAll(voidGrate(axis,plane)) }
        }
        body
    }
    static List voidGrate(int axis,int plane) {
        def tangents=(0..2).findAll { it!=axis },parts=[]
        def bar={ u,U,v,V ->
            def from=[0,0,0],to=[0,0,0]
            from[axis]=plane;to[axis]=plane+1
            from[tangents[0]]=u;to[tangents[0]]=U
            from[tangents[1]]=v;to[tangents[1]]=V
            parts << cuboid(from,to,'grate')
        }
        // Crossings belong to the full bars; gap spans avoid overlapping solids.
        [[5,6],[7.5,8.5],[10,11]].each { band -> bar(band[0],band[1],4,12) }
        [[4,5],[6,7.5],[8.5,10],[11,12]].each { gap ->
            [[5,6],[7.5,8.5],[10,11]].each { band -> bar(gap[0],gap[1],band[0],band[1]) }
        }
        parts
    }
    /** NORTH-facing sleeve: front ring plus outer/inner walls, without a rear cap. */
    static List pumpSleeve(int outerPlane, int bodyPlane) {
        assert outerPlane < bodyPlane
        def front=squareFlange(outerPlane,'identity')
        front.each { e -> e.to[2]=outerPlane; e.faces=e.faces.subMap(['north']) }
        def walls=[]
        [[3,3,13,3,'down'],[3,13,13,13,'up'],[3,3,3,13,'west'],[13,3,13,13,'east'],
         [6,6,10,6,'up'],[6,10,10,10,'down'],[6,6,6,10,'east'],[10,6,10,10,'west']].each { a ->
            def e=cuboid([a[0],a[1],outerPlane],[a[2],a[3],bodyPlane],'metal')
            e.faces=e.faces.subMap([a[4]]);walls << e
        }
        front+walls
    }
    static List pumpHousing() {
        def facets=[cuboid([3.5,6,4],[4,10,12],'metal'),cuboid([12,6,4],[12.5,10,12],'metal')]
        [-45,0,45].each { angle ->
            def facet=cuboid([6,3.7,4],[10,4.2,12],'metal')
            if(angle!=0)facet.rotation=[origin:[8,8,8],axis:'z',angle:angle,rescale:false]
            facets << facet
        }
        facets
    }
    static MobPixelCanvas fixtureIdentity(Map variant,Map palettes) {
        def c=new MobPixelCanvas();c.panel(0,0,15,15,'base');c.bevel(0,0,15,15)
        c.recessedBorder(1,1,14,14)
        if(variant.kind=='valve') {
            [5,7,9,11].each { x -> [5,7,9,11].each { y -> c.put(x,y,'deep') } }
        }
        int accent=color(palettes.fixed[variant.resource])
        if(variant.kind=='void') {
            c=new MobPixelCanvas();c.panel(0,0,15,15,'base')
            [3,12].each { x -> [3,12].each { y -> c.indicator(x,y,accent) } }
        }
        else c.channels(variant.direction,accent)
        c
    }
    static void fixtureAssets(File root,File output,Map geometry,String finish,Map palettes,List assets,
            Set names,Set paths,Closure texture,Closure writer) {
        def config=new JsonSlurper().parse(new File(root,'fixtures.json'))
        int firstAsset=assets.size()
        assert config.bodyWidth==10
        def metal=new MobPixelCanvas();metal.panel(0,0,15,15,'base');metal.bevel(0,0,15,15)
        texture('fixture_metal',metal)
        def auger=new MobPixelCanvas();auger.panel(0,0,15,15,'light');auger.line(0,15,15,15,'shadow')
        texture('fixture_auger',auger)
        def grate=new MobPixelCanvas();grate.panel(0,0,15,15,'shadow');grate.recessedBorder(0,0,15,15)
        texture('fixture_grate',grate)
        def hot=new MobPixelCanvas();hot.panel(0,0,15,15,color('#A82D16'))
        hot.panel(2,2,13,13,color('#DF551B'));hot.panel(4,4,11,11,color('#FF942E'))
        hot.panel(6,6,9,9,color('#FFC65B'));texture('fixture_hot',hot)
        for(def variant : config.variants) {
            texture('fixture_'+variant.id,fixtureIdentity(variant,palettes))
            def base="mobvats:block/procedural/${finish}/"
            def materials=[particle:base+'fixture_'+variant.id,identity:base+'fixture_'+variant.id,
                metal:base+'fixture_metal',auger:base+'fixture_auger',grate:base+'fixture_grate',hot:base+'fixture_hot']
            def core=fixtureBody(variant.kind)
            if(variant.kind=='pump')writer("procedural/${finish}/${variant.id}_sleeve",
                [render_type:'minecraft:solid',ambientocclusion:false,textures:materials,elements:pumpSleeve(0,3)])
            writer("procedural/${finish}/${variant.id}_core",[render_type:'minecraft:solid',ambientocclusion:false,textures:materials,elements:core])
            for(def family : variant.families) {
                def structural=materials+[frame:base+family+'_frame',trim:base+family+'_trim',accent:base+family+'_accent'];
                for(def cladding : ['bare','casing','glass']) {
                    def elements=core+(cladding=='bare' ? [] : frame(geometry,family,cladding=='glass'))
                    writer("procedural/${finish}/${family}_${cladding}_${variant.id}",
                        [render_type:cladding=='glass'?'minecraft:translucent':'minecraft:solid',ambientocclusion:false,textures:structural,elements:elements])
                }
                if(finish=='t1') {
                    if(family=='vat') {
                        String id=variant.id
                        writer(id,[parent:"mobvats:block/procedural/t1/${family}_bare_${variant.id}"])
                        String path="assets/mobvats/models/item/${id}.json"
                        assert paths.add(path)
                        json(new File(output,path),inventoryModel("mobvats:block/${id}"))
                    }
                }
            }
        }
        if(finish=='t1') {
            String path='assets/mobvats/fixture_mesh.json';assert paths.add(path)
            json(new File(output,path),[auger:screwAuger(config.auger),bindings:config.variants.collectMany { v ->
                [[block:v.id,kind:v.kind,core:v.id+'_core',family:'vat',palette:'t1']]
            }])
        }
        assets.drop(firstAsset).each { a ->
            a.recipe='tools/procedural-art/fixtures.json'
            def variant=config.variants.find { 'fixture_'+it.id==a.recipeId }
            if(variant) {a.resource=variant.resource;a.direction=variant.direction}
        }
    }
    static MobPixelCanvas greenscreen(Map spec,String glyph) {
