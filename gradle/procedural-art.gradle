        [cuboid([8-v.depth/2,8-v.height/2,8-v.width/2],[8+v.depth/2,6,6],'vise_metal'),
         cuboid([8-v.depth/2,10,8-v.width/2],[8+v.depth/2,8+v.height/2,6],'vise_metal'),
         cuboid([8-v.depth/2,6,8-v.width/2],[6.5,10,6],'vise_metal'),
         cuboid([9.5,6,8-v.width/2],[8+v.depth/2,10,6],'vise_metal')]
